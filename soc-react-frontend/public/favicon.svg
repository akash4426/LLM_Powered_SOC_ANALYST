<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#050709"/>

  <!-- Shield body -->
  <path d="M16 3L5 7.5V15c0 6.5 4.8 11.5 11 13.5C22.2 26.5 27 21.5 27 15V7.5L16 3Z" fill="#0a1a22" stroke="#00d4ff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Inner shield glow fill -->
  <path d="M16 5.5L7 9.5V15c0 5.5 4 9.8 9 11.5 5-1.7 9-6 9-11.5V9.5L16 5.5Z" fill="url(#shieldGrad)" opacity="0.3"/>

  <!-- Horizontal scan line -->
  <line x1="8" y1="15" x2="24" y2="15" stroke="#00d4ff" stroke-width="0.7" stroke-dasharray="2 1.5" opacity="0.6"/>

  <!-- Center eye / detection circle -->
  <circle cx="16" cy="15" r="4" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
  <circle cx="16" cy="15" r="1.8" fill="#00d4ff" opacity="0.9"/>

  <!-- Corner circuit dots -->
  <circle cx="10" cy="12" r="0.8" fill="#00d4ff" opacity="0.4"/>
  <circle cx="22" cy="12" r="0.8" fill="#00d4ff" opacity="0.4"/>
  <circle cx="10" cy="18" r="0.8" fill="#00d4ff" opacity="0.4"/>
  <circle cx="22" cy="18" r="0.8" fill="#00d4ff" opacity="0.4"/>

  <!-- Corner tick marks -->
  <line x1="8" y1="12" x2="10.5" y2="12" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/>
  <line x1="21.5" y1="12" x2="24" y2="12" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/>
  <line x1="8" y1="18" x2="10.5" y2="18" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/>
  <line x1="21.5" y1="18" x2="24" y2="18" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/>

  <!-- Gradient def -->
  <defs>
    <radialGradient id="shieldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
  </defs>
</svg>